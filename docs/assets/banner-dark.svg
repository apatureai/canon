<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300"
     role="img" aria-label="canon: the design system a repo actually declares">
  <!-- ground -->
  <rect width="1200" height="300" fill="#0D1117"/>

  <!-- texture: fine dot grid, 24px pitch, 6% -->
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#E6EDF3"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#dots)" opacity="0.06" aria-hidden="true"/>

  <!-- motif: ragged declared token swatches resolve through a funnel into one
       ordered, aligned canon set -->
  <g aria-hidden="true" stroke-linecap="round" stroke-linejoin="round">

    <!-- input column: the mess a repo actually declares (ragged widths, tones, x-jitter) -->
    <rect x="112" y="72"  width="52" height="16" rx="4" fill="#30363D"/>
    <rect x="118" y="98"  width="36" height="16" rx="4" fill="#30363D"/>
    <rect x="112" y="124" width="52" height="16" rx="4" fill="#D4A24E" opacity="0.35"/>
    <rect x="122" y="150" width="28" height="16" rx="4" fill="#21262D"/>
    <rect x="116" y="176" width="44" height="16" rx="4" fill="#30363D"/>
    <rect x="112" y="202" width="52" height="16" rx="4" fill="#D4A24E" opacity="0.35"/>

    <!-- funnel: outline only, resolving the column to a single throat -->
    <path d="M 196 64 L 258 128" fill="none" stroke="#8B949E" stroke-width="2"/>
    <path d="M 196 236 L 258 172" fill="none" stroke="#8B949E" stroke-width="2"/>
    <path d="M 258 128 H 272" fill="none" stroke="#8B949E" stroke-width="2"/>
    <path d="M 258 172 H 272" fill="none" stroke="#8B949E" stroke-width="2"/>

    <!-- output: the canon — three identical swatches, same size, same spacing, aligned -->
    <rect x="288" y="118" width="56" height="16" rx="4" fill="#D4A24E"/>
    <rect x="288" y="142" width="56" height="16" rx="4" fill="#D4A24E"/>
    <rect x="288" y="166" width="56" height="16" rx="4" fill="#D4A24E"/>
  </g>

  <!-- type -->
  <text x="428" y="142"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="76" font-weight="600" letter-spacing="-1.5" fill="#E6EDF3">canon</text>
  <rect x="430" y="164" width="96" height="4" rx="2" fill="#D4A24E"/>
  <text x="428" y="210"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="400" letter-spacing="0.2" fill="#8B949E">the design system a repo actually declares</text>
</svg>
